<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something Made For Bugu 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#3a3038;
  --muted:#8d7984;
  --pink:#c85a91;
  --violet:#8170c9;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  font-family:'DM Sans',sans-serif;
  color:var(--ink);
  background:#f7f2f6;
}

/* Background */
body:before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-10;
  pointer-events:none;

  background:
    radial-gradient(circle at 12% 18%,rgba(255,132,190,.32),transparent 22%),
    radial-gradient(circle at 85% 12%,rgba(130,116,224,.30),transparent 24%),
    radial-gradient(circle at 91% 76%,rgba(99,174,226,.28),transparent 23%),
    radial-gradient(circle at 22% 88%,rgba(255,180,119,.22),transparent 22%),
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.75),transparent 38%);

  animation:aurora 20s ease-in-out infinite alternate;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-9;
  pointer-events:none;
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.45),
      transparent 45%,
      rgba(255,255,255,.25)
    );
}

/* Floating orbs */
.orb{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:-3;
  filter:blur(4px);
}

.orb.one{
  width:260px;
  height:260px;
  left:-160px;
  top:18%;
  background:rgba(241,113,176,.16);
  animation:orb1 12s ease-in-out infinite;
}

.orb.two{
  width:340px;
  height:340px;
  right:-200px;
  bottom:4%;
  background:rgba(111,143,222,.15);
  animation:orb2 15s ease-in-out infinite;
}

/* Main */
.page{
  width:min(100%,1200px);
  margin:auto;
  padding:20px 28px 65px;
  position:relative;
  z-index:1;
}

/* Signature */
.signature{
  width:max-content;
  margin:4px auto 0;
  padding:8px 18px 5px;
  position:relative;
  z-index:5;
  animation:signatureIn 1.2s .05s both;
}

.signature:before{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(255,255,255,.62);
  border-radius:30px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(84,51,73,.06);
  z-index:-1;
}

.signature-name{
  font-family:'Parisienne',cursive;
  font-size:2.15rem;
  line-height:1;
  color:#b64f83;
  letter-spacing:.5px;
  text-shadow:0 3px 12px rgba(182,79,131,.15);
}

.signature-heart{
  font-family:serif;
  color:#d56b9d;
  margin:0 3px;
  font-size:1rem;
  vertical-align:middle;
}

/* Heading */
.hero{
  text-align:center;
  padding:52px 10px 28px;
  animation:fadeUp 1s .15s both;
}

.eyebrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:15px;
  color:#a0788d;
  font-size:.61rem;
  font-weight:700;
  letter-spacing:3.5px;
  text-transform:uppercase;
}

.eyebrow:before,
.eyebrow:after{
  content:"";
  width:31px;
  height:1px;
  background:linear-gradient(90deg,#e17baa,#8270ca);
}

h1{
  margin:0;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3.2rem,7vw,6rem);
  line-height:.9;
  font-weight:600;
  letter-spacing:-1.8px;
  color:#352b32;
}

h1 em{
  font-style:italic;
  font-weight:500;
  background:linear-gradient(90deg,#c64f8b,#7e6bc7,#689bd3);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  background-size:200% auto;
  animation:gradientShift 7s ease-in-out infinite alternate;
}

.subtitle{
  max-width:650px;
  margin:24px auto 0;
  color:var(--muted);
  font-size:.88rem;
  line-height:1.85;
}

/* Book shell */
.book-shell{
  width:min(100%,900px);
  margin:15px auto 0;
  padding:14px;

  border:1px solid rgba(255,255,255,.82);
  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.58),
      rgba(255,255,255,.24)
    );

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 30px 90px rgba(72,49,65,.13),
    inset 0 1px 0 white;

  animation:bookIn 1.1s .3s cubic-bezier(.2,.8,.2,1) both;
}

/* Canva container */
.canva-wrap{
  position:relative;
  width:100%;
  height:0;

  padding-top:150%;

  overflow:hidden;
  border-radius:20px;

  background:#fff;

  box-shadow:
    0 10px 35px rgba(63,69,81,.12),
    inset 0 1px 0 rgba(255,255,255,.8);
}

.canva-wrap iframe{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;

  border:0;
  padding:0;
  margin:0;

  display:block;
}

/* Bottom message */
.bottom-message{
  text-align:center;
  margin:27px auto 0;
  color:#9a8490;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:1.15rem;
}

/* Buttons */
.navigation{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:25px;
}

.nav-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  padding:11px 19px;

  border:1px solid rgba(255,255,255,.82);
  border-radius:999px;

  background:rgba(255,255,255,.38);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  color:#80566f;
  font-size:.68rem;
  font-weight:700;

  box-shadow:
    0 10px 25px rgba(72,49,65,.07),
    inset 0 1px 0 white;

  transition:
    transform .35s ease,
    box-shadow .35s ease,
    background .35s ease;
}

.nav-button:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,.58);
  box-shadow:0 18px 35px rgba(72,49,65,.12);
}

/* Floating hearts */
.heart{
  position:fixed;
  bottom:-25px;
  color:#d16e9d;
  opacity:0;
  animation:floatUp 11s linear forwards;
  z-index:0;
  pointer-events:none;
  filter:drop-shadow(0 4px 8px rgba(190,90,137,.14));
}

/* Animations */
@keyframes aurora{
  from{
    transform:translate3d(-2%,-1%,0) scale(1);
  }
  to{
    transform:translate3d(3%,2%,0) scale(1.09);
  }
}

@keyframes orb1{
  50%{
    transform:translate(42px,-22px) scale(1.08);
  }
}

@keyframes orb2{
  50%{
    transform:translate(-38px,18px) scale(.94);
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes signatureIn{
  from{
    opacity:0;
    transform:translateY(-12px) scale(.94);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes bookIn{
  from{
    opacity:0;
    transform:translateY(35px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes gradientShift{
  from{
    background-position:0% center;
  }
  to{
    background-position:100% center;
  }
}

@keyframes floatUp{
  0%{
    transform:translateY(0) rotate(0) scale(.8);
    opacity:0;
  }

  12%{
    opacity:.22;
  }

  100%{
    transform:translateY(-110vh) rotate(18deg) scale(1.25);
    opacity:0;
  }
}

/* Mobile */
@media(max-width:760px){

  .page{
    padding:13px 12px 45px;
  }

  .signature{
    margin-top:3px;
    padding:7px 15px 4px;
  }

  .signature-name{
    font-size:1.85rem;
  }

  .hero{
    padding:42px 4px 24px;
  }

  .eyebrow{
    font-size:.5rem;
    letter-spacing:2.5px;
  }

  h1{
    font-size:clamp(3rem,13vw,4.8rem);
    letter-spacing:-1.2px;
  }

  .subtitle{
    font-size:.76rem;
    line-height:1.75;
    margin-top:19px;
  }

  .book-shell{
    padding:7px;
    border-radius:22px;
  }

  .canva-wrap{
    border-radius:16px;
  }

  .bottom-message{
    font-size:1rem;
    margin-top:21px;
  }

  .navigation{
    margin-top:20px;
  }

  .nav-button{
    padding:10px 16px;
    font-size:.62rem;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="page">

  <div class="signature" aria-label="Bugu Pugu">
    <div class="signature-name">
      Bugu <span class="signature-heart">♥</span> Pugu
    </div>
  </div>

  <section class="hero">

    <div class="eyebrow">
      Something made with love
    </div>

    <h1>
      Our <em>Love Book</em>
    </h1>

    <p class="subtitle">
      A little collection of words, memories, feelings,
      and tiny pieces of us — made especially for Bugu. 💗
    </p>

  </section>

  <section class="book-shell">

    <div class="canva-wrap">

      <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHP7loEbAI/mr1UKVKf0MbQHh8Rj5uHNw/view?embed"
        allowfullscreen="allowfullscreen"
        allow="fullscreen">
      </iframe>

    </div>

  </section>

  <div class="bottom-message">
    Every page has a little piece of my heart. ♡
  </div>

  <div class="navigation">

    <a class="nav-button" href="javascript:history.back()">
      ← Back
    </a>

    <a class="nav-button" href="index.html">
      ♥ Our Journey
    </a>

  </div>

</main>

<script>

/* Floating hearts */
setInterval(() => {

  const h = document.createElement("div");

  h.className = "heart";
  h.textContent = "♡";

  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (Math.random() * 13 + 13) + "px";

  document.body.appendChild(h);

  setTimeout(() => h.remove(), 9000);

}, 1400);

</script>

</body>
</html>
