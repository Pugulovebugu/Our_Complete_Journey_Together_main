<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2nd Birthday — Options 🎂💜</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:25px;
    background:linear-gradient(135deg,#eee9ff,#f5edff,#fff3fb);
    background-size:300% 300%;
    animation:bgShift 12s infinite alternate;
    font-family:'Poppins',sans-serif;
    text-align:center;
}

@keyframes bgShift{
    from{background-position:left}
    to{background-position:right}
}

h1{
    margin-top:40px;
    font-size:3rem;
    font-family:'DancingScript',cursive;
    color:#8b5cf6;
    text-shadow:0 0 16px rgba(139,92,246,0.45);
}

.subtitle{
    margin-top:-10px;
    font-size:1.2rem;
    color:#7651a8;
    opacity:0.8;
}

/* BOXES */
.container{
    margin-top:40px;
    display:flex;
    flex-direction:column;
    gap:22px;
    align-items:center;
}

.btn-box{
    background:white;
    width:80%;
    max-width:350px;
    padding:20px;
    border-radius:25px;
    border:2px solid #d9c7ff;
    box-shadow:0 8px 22px rgba(139,92,246,0.20);
    transition:0.3s ease;
}

.btn-box:hover{
    transform:scale(1.04);
    box-shadow:0 12px 28px rgba(139,92,246,0.30);
}

.btn-box a{
    font-size:1.4rem;
    text-decoration:none;
    font-weight:600;
    color:#8b5cf6;
}

/* BACK BUTTON */
.back{
    margin-top:40px;
    display:inline-block;
    padding:12px 25px;
    background:#b79af7;
    color:white;
    border-radius:22px;
    text-decoration:none;
    font-weight:600;
}

.back:hover{
    background:#9f7aea;
}
</style>
</head>

<body>

<h1>2nd Birthday 🎂💜</h1>
<p class="subtitle">05 • 09 • 2026</p>

<div class="container">

    <div class="btn-box">
        <a href="codes/birthday.html">💌 Birthday Wishes</a>
    </div>

    <div class="btn-box">
        <a href="gallery/birthday2_gallery.html">📸 Photo Gallery</a>
    </div>

</div>

<a href="../birthday_main.html" class="back">← Back</a>

</body>
</html>
